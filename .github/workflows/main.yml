name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        # Se recomienda npm ci para entornos de CI/CD por su confiabilidad y velocidad.
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_SERVICE_ID: ${{ secrets.VITE_APP_SERVICE_ID }}
          VITE_APP_TEMPLATE_ID: ${{ secrets.VITE_APP_TEMPLATE_ID }}
          VITE_APP_PUBLIC_KEY: ${{ secrets.VITE_APP_PUBLIC_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
